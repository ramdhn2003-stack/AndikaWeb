<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="theme-color" content="#080d25">

    <title>A Sky Full of You | Aas</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="sky" id="sky">

        <!-- BINTANG -->
        <div class="stars" id="stars"></div>

        <!-- BULAN -->
        <div class="moon"></div>

        <!-- METEOR -->
        <div class="meteor"></div>

        <!-- KONTEN UTAMA -->
        <section class="content">

            <p class="subtitle">
                SEBUAH PESAN KECIL UNTUK AAS
            </p>

            <h1>
                A Sky Full of You
            </h1>

            <p class="description">
                Dari sekian banyak bintang yang menghiasi malam,
                entah mengapa semesta selalu mengarahkanku kepadamu.
            </p>

            <button id="openLetter">
                Buka Surat Kecilku ♡
                Buka Surat Kecilku ♡
            </button>

            <!-- SURAT -->
            <div class="letter" id="letter">

                <div class="letter-decoration">
                    ✦ &nbsp; ✧ &nbsp; ✦
                </div>

                <h2>Untuk Aas,</h2>

                <p id="typing"></p>

                <div class="letter-footer">
                    <span>Dengan segala rasa,</span>
                    <h3>Aku. ♡</h3>
                </div>

            </div>

            <p class="hint">
                ✦ Sentuh langit untuk menciptakan bintang ✦
            </p>

        </section>

        <!-- PEGUNUNGAN -->
        <div class="mountain mountain-back"></div>
        <div class="mountain mountain-front"></div>

        <!-- FOOTER -->
        <div class="footer">
            MADE WITH LOVE, FOR AAS ♡
        </div>

    </main>

    <script src="script.js"></script>

</body>
</html>
